name: Build Frontend
description: Build and lint the frontend Vue/Vite module
inputs:
  node-version:
    description: Node.js version
    required: false
    default: '20'
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: frontend/package.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci
      shell: bash

    - name: Build
      working-directory: frontend
      run: npm run build
      shell: bash

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist
        retention-days: 5
