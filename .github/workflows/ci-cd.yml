name: Smart Community CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  MAVEN_CACHE_DIR: ~/.m2/repository
  NPM_CACHE_DIR: ~/.npm

jobs:
  validate-dependencies:
    name: Validate Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging library
        run: pip install packaging

      - name: Run dependency security check
        run: python scripts/check-dependencies.py backend/pom.xml

  build-and-test:
    name: Build & Test (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: validate-dependencies
    strategy:
      matrix:
        module: [backend, frontend]
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend
        if: matrix.module == 'backend'
        uses: ./.github/actions/build-backend
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Build frontend
        if: matrix.module == 'frontend'
        uses: ./.github/actions/build-frontend
        with:
          node-version: ${{ env.NODE_VERSION }}

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY || '' }}
          username: ${{ secrets.DOCKER_USERNAME || '' }}
          password: ${{ secrets.DOCKER_PASSWORD || '' }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ vars.DOCKER_REGISTRY != '' }}
          tags: ${{ vars.DOCKER_REGISTRY || 'smart-community' }}/backend:${{ github.sha }},${{ vars.DOCKER_REGISTRY || 'smart-community' }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: ${{ vars.DOCKER_REGISTRY != '' }}
          tags: ${{ vars.DOCKER_REGISTRY || 'smart-community' }}/frontend:${{ github.sha }},${{ vars.DOCKER_REGISTRY || 'smart-community' }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy with Docker Compose
        run: |
          cp .env.example .env
          docker compose up -d --build
          echo "Waiting for services to be healthy..."
          sleep 30
          docker compose ps
          curl -f http://localhost:8674/api/health || echo "Health check endpoint not available yet"
          curl -f http://localhost:3674 || echo "Frontend not available yet"
