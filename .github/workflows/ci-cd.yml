name: Smart Community CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  validate-dependencies:
    name: Validate Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Run dependency security check
        run: python scripts/check-dependencies.py

  build-and-test:
    name: Build and Test
    needs: validate-dependencies
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend
        if: matrix.module == 'backend'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend with Maven
        if: matrix.module == 'backend'
        run: mvn -B package -DskipTests
        working-directory: backend

      - name: Setup Node.js
        if: matrix.module == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies
        if: matrix.module == 'frontend'
        run: npm ci
        working-directory: frontend

      - name: Build Frontend
        if: matrix.module == 'frontend'
        run: npm run build
        working-directory: frontend

      - name: Upload Backend Artifact
        if: matrix.module == 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifact
          path: backend/target/*.war

      - name: Upload Frontend Artifact
        if: matrix.module == 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-artifact
          path: frontend/dist

  deploy:
    name: Deploy to Test Environment
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-artifact
          path: backend/target

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-artifact
          path: frontend/dist

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Build and Deploy with Docker Compose
        run: |
          docker compose up -d --build
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || 'root3674' }}
          MYSQL_DATABASE: smart_community
          MYSQL_USER: smart_user
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD || 'smart_pass_3674' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'smart-community-secret-3674' }}
          APP_CRYPTO_KEY: ${{ secrets.APP_CRYPTO_KEY || 'smart-community-crypto-key-3674' }}
